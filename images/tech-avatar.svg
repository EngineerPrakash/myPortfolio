  <ellipse cx="200" cy="205" rx="62" ry="70" fill="#f0b98d"/>
  <!-- hair -->
  <path d="M138 195c-4-52 30-82 66-80 40 2 62 32 56 82-12-30-34-44-62-44s-48 14-60 42z" fill="#1f2937"/>
  <!-- glasses -->
