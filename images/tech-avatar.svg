<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Developer avatar with laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#fff" opacity=".08"><circle cx="60" cy="70" r="40"/><circle cx="350" cy="120" r="55"/><circle cx="320" cy="340" r="35"/></g>
  <g font-family="monospace" font-weight="700" fill="#5eead4" opacity=".55">
    <text x="28" y="140" font-size="30">&lt;/&gt;</text><text x="316" y="70" font-size="26">{ }</text>
    <text x="40" y="270" font-size="24">&#10003;</text><text x="330" y="250" font-size="24">&gt;_</text>
  </g>
  <!-- body -->
  <path d="M95 400c0-62 46-100 105-100s105 38 105 100z" fill="#1e293b"/>
  <path d="M175 300l25 38 25-38z" fill="#f1f5f9"/>
