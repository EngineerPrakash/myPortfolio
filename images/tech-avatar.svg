  <g fill="#5eead4" opacity=".35"><rect x="153" y="193" width="34" height="26" rx="8"/><rect x="213" y="193" width="34" height="26" rx="8"/></g>
  <circle cx="170" cy="206" r="4" fill="#0f172a"/><circle cx="230" cy="206" r="4" fill="#0f172a"/>
