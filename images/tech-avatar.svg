  <rect x="124" y="320" width="152" height="80" rx="6" fill="url(#scr)"/>
  <g font-family="monospace" font-size="11" fill="#5eead4"><text x="134" y="340">test('login', () =&gt; {</text><text x="144" y="356" fill="#a5b4fc">expect(page).toPass()</text><text x="134" y="372">})</text></g>
</svg>
